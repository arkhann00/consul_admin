services:
  admin-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${ADMIN_DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules
    environment:
      # С браузера на хосте бэкенд обычно на localhost:8081
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://5.42.113.18:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  admin_node_modules:
