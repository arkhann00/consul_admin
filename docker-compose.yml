services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Пустой URL: браузер → :8082, nginx → API_UPSTREAM
        VITE_API_BASE_URL: ""
    env_file: .env
    ports:
      - "${ADMIN_PORT}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
