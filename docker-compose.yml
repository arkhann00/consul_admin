services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Пустая строка: браузер ходит на тот же хост, nginx проксирует /api и /uploads
        VITE_API_BASE_URL: ""
    ports:
      - "${ADMIN_PORT:-8082}:80"
    environment:
      # Адрес бэкенда (nginx проксирует /api, /uploads, /health)
      API_UPSTREAM: ${API_UPSTREAM:-http://5.42.113.18:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
